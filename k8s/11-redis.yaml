apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: redis
  template: 
    metadata:
      labels: 
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowgate-secret
                  key: REDIS_PASSWORD
          ports: 
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
               - sh
               - -c
               - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata: 
  name: redis
spec:
  selector: 
    app: redis
  ports:
    - port: 6379
      targetPort: 6379