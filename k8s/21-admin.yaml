apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: flowgate-admin:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":8092"]
          ports:
            - containerPort: 8092
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgate-secret
                  key: DATABASE_URL
            # 集群内上游（Service 名解析到 Pod/ClusterIP）需要放行集群网段；
            # 按实际 CNI 网段改，默认 k3s 是 10.42.0.0/16 + 10.43.0.0/16。
            - name: ALLOW_UPSTREAM_CIDRS
              value: "10.42.0.0/16,10.43.0.0/16"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8092
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8092
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  selector:
    app: admin
  ports:
    - port: 8092
      targetPort: 8092
