name: flowgate

services:
  postgres:
    image: postgres:16
    container_name: flowgate-postgres
    environment:
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
      POSTGRES_DB: flowgate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis:
    image: redis:8-alpine
    container_name: flowgate-redis
    command: ["redis-server", "--requirepass", "flowgate"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "flowgate", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  gateway:
    build:
      context: ..
      args:
        BIN: gateway
    container_name: flowgate-gateway
    # 上游 key（DEEPSEEK_API_KEY / ZHIPU_API_KEY 等）从根目录 .env 注入；
    # environment 里的同名字段优先级更高，会覆盖 .env 里的本地地址。
    env_file:
      - ../.env
    command: ["-ai-config", "/etc/flowgate/ai.yaml"]
    volumes:
      # 首次启动用 ai.yaml 给 DB 做种子；之后 DB 是配置事实来源。
      - ../ai.yaml:/etc/flowgate/ai.yaml:ro
    environment:
      DATABASE_URL: postgres://flowgate:flowgate@postgres:5432/flowgate
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: flowgate
    ports:
      - "8090:8090"
      - "9090:9090"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  admin:
    build: 
      context: ..
      args:
        BIN: admin
    container_name: flowgate-admin
    # admin 顺带托管控制台静态文件（web/dist），页面与 API 同源，不需要 nginx。
    # 构建前端：cd ../web && pnpm build
    command: ["-addr", ":8092", "-web-dir", "/app/web"]
    environment:
      DATABASE_URL: postgres://flowgate:flowgate@postgres:5432/flowgate
      ALLOW_PRIVATE_UPSTREAM: "1"
      # 只用于查询租户当窗 TPM 用量；不配也能启动，接口返回 503。
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: flowgate
    volumes:
      - ../web/dist:/app/web:ro
    ports:
      - "8092:8092"
    depends_on:
      postgres: { condition:  service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
